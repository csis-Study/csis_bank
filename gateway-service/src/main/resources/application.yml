server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  web:
    resources:
      static-locations: classpath:/META-INF/resources/
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]': # 匹配所有路由
            allowed-origin-patterns:
              - "http://localhost:[*]"
            allowed-methods: # 允许的HTTP方法
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"  # 允许的请求头
            allow-credentials: true  # 是否允许携带凭证（如Cookie）
            max-age: 3600        # 预检请求缓存时间（秒）
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: client-service-clients
          uri: lb://client-service
          predicates:
            - Path=/api/clients/**
          filters:
            - StripPrefix=1
        - id: client-service-assets
          uri: lb://client-service
          predicates:
            - Path=/api/assets/**
          filters:
            - StripPrefix=1
        - id: usr-service-admins
          uri: lb://usr-service
          predicates:
            - Path=/api/admins/**
          filters:
            - StripPrefix=1
        - id: usr-service-advisors
          uri: lb://usr-service
          predicates:
            - Path=/api/advisors/**
          filters:
            - StripPrefix=1
        - id: usr-service-approval-personnel
          uri: lb://usr-service
          predicates:
            - Path=/api/approval-personnel/**
          filters:
            - StripPrefix=1
        - id: usr-service-risk-officers
          uri: lb://usr-service
          predicates:
            - Path=/api/risk-officers/**
          filters:
            - StripPrefix=1
        - id: usr-service-users
          uri: lb://usr-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: portfolio-service-products
          uri: lb://portfolio-service
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
        - id: portfolio-service-product-items
          uri: lb://portfolio-service
          predicates:
            - Path=/api/product-items/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
        - id: portfolio-service-history
          uri: lb://portfolio-service
          predicates:
            - Path=/api/history/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        - id: trade-service-trades
          uri: lb://trade-service
          predicates:
            - Path=/api/trade/**
          filters:
            - StripPrefix=1
        - id: advisory-service-recommendations
          uri: lb://advisory-service
          predicates:
            - Path=/api/recommendations/**
          filters:
            - StripPrefix=1
        - id: advisory-service-recommendations-item
          uri: lb://advisory-service
          predicates:
            - Path=/api/recommendationsItem/**
          filters:
            - StripPrefix=1